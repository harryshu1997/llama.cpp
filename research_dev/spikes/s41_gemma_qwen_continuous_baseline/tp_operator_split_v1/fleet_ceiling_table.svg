<text x="44" y="476" font-size="12.5" fill="#5b6470">Offloading gate+up only; the down projection stays on the server, capping compute savings at 66.7%. Server power scaled from a 124.7 W measured baseline.</text>
<text x="44" y="495" font-size="12.5" fill="#5b6470">Beyond 16 phones the column budget is exhausted, so added phones raise fleet power without removing further server work.</text>
<text x="44" y="516" font-size="12.5" fill="#D55E00"><tspan font-weight="700">Modelled, not measured.</tspan><tspan> The only measured configuration is N=1, where the observed speedup is ~0.5&#8211;0.9% (not 1.07x).</tspan></text>
<text x="44" y="535" font-size="12.5" fill="#D55E00">Fleet energy has never been measured at any N; the one measured energy acquisition was +30.5% per layer, a loss.</text>
