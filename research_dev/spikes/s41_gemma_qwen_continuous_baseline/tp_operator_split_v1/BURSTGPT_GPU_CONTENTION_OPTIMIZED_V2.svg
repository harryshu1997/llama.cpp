<text x="1032.0" y="807.0" class="callout" text-anchor="start">Choose policy by service objective</text>
<text x="1032.0" y="838.0" class="small" text-anchor="start">Keep Qwen speed: share P-cores; Gemma +11.6%.</text>
<text x="1032.0" y="866.0" class="small" text-anchor="start">Minimize cold latency: isolate P-core primaries; Gemma +24.6%.</text>
<text x="1032.0" y="894.0" class="tick" text-anchor="start">Both use the same dynamic 8192 / 11136 prefill and 9664 decode split.</text>
<text x="55.0" y="990.0" class="note" text-anchor="start">Workload: 17 BurstGPT-timed Gemma4-12B Q4_0 requests (505 output tokens) on CPU + OP15; Qwen3-14B Q4_K_M saturates the GPU.</text>
<text x="55.0" y="1014.0" class="note" text-anchor="start">Bars and points are three-run medians; makespan whiskers show min-max. All optimized runs returned the same token sequences.</text>
<text x="55.0" y="1038.0" class="note" text-anchor="start">The idle control has no active Qwen requests and is omitted from the throughput scatter.</text>
