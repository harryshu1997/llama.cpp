<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
<title id="title">Optimized busy-GPU comparison for CPU plus OP15 inference</title>
<desc id="description">Three-run medians compare the idle control, the original busy-GPU baseline, and two optimized CPU-affinity policies for concurrent Qwen and Gemma inference.</desc>
