<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 31px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #475569; }
      .panel-label { font-family: Helvetica, Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .lane { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #334155; }
      .box-title { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .box-text { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
      .metric-title { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .metric { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .metric-strong { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .step { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .state { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .edge-gray { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow-gray); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .edge-green { fill: none; stroke: #059669; stroke-width: 2.8; marker-end: url(#arrow-green); }
      .edge-gold { fill: none; stroke: #d97706; stroke-width: 2.8; marker-end: url(#arrow-gold); }
      .edge-red { fill: none; stroke: #dc2626; stroke-width: 3.2; marker-end: url(#arrow-red); }
      .edge-control { fill: none; stroke: #64748b; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#ffffff"/>
  <text x="50" y="48" class="title">GPU-first mixed-ubatch scheduling with grouped NPU prefill continuation</text>
  <text x="50" y="78" class="subtitle">OnePlus 15 validation: Qwen2.5 0.5B Q8_0, prompt = 500, ubatch = 64, decode context = 32</text>

  <!-- Panel (a): baseline -->
  <rect x="42" y="108" width="1716" height="274" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="142" class="panel-label">(a)</text>
  <text x="105" y="142" class="panel-title">Baseline: one GPU context hides the early decode result behind the internal ubatch loop</text>

  <rect x="80" y="183" width="215" height="100" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
  <text x="187" y="214" class="box-title">Request scheduler</text>
  <text x="187" y="241" class="box-text">A: one decode row</text>
  <text x="187" y="263" class="box-text">B: 500 prefill rows</text>

  <rect x="355" y="183" width="240" height="100" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
  <text x="475" y="214" class="box-title">Logical mixed batch</text>
  <text x="475" y="241" class="box-text">[D, P0, P1, ..., P499]</text>
  <text x="475" y="263" class="small">single llama_decode()</text>

  <rect x="660" y="169" width="690" height="128" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1005" y="194" class="box-title">GPU / OpenCL: internal physical-ubatch loop</text>
  <rect x="686" y="214" width="124" height="54" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="748" y="236" class="box-title">U0</text>
  <text x="748" y="257" class="small">D + 63P</text>
  <rect x="830" y="214" width="82" height="54" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="871" y="246" class="box-title">U1</text>
  <rect x="932" y="214" width="82" height="54" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="973" y="246" class="box-title">U2</text>
  <text x="1040" y="247" class="panel-title">...</text>
  <rect x="1090" y="214" width="82" height="54" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1131" y="246" class="box-title">U7</text>
  <rect x="1192" y="214" width="132" height="54" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1258" y="236" class="box-title">API return</text>
  <text x="1258" y="257" class="small">906.61 ms median</text>

  <rect x="1430" y="183" width="270" height="100" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1565" y="214" class="box-title">Response and B state</text>
  <text x="1565" y="241" class="box-text">sample A, then publish</text>
  <text x="1565" y="263" class="box-text">B becomes GPU-ready</text>

  <path d="M295 233 H355" class="edge-gray"/>
  <path d="M595 233 H660" class="edge-gray"/>
  <path d="M1350 233 H1430" class="edge-red"/>
  <path d="M748 214 V166 H1400 V208 H1430" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="1080" y="158" class="small" fill="#dc2626">U0 logits exist early, but no request-level return path exists</text>

  <!-- Panel (b): proposed workflow -->
  <rect x="42" y="405" width="1716" height="680" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.7"/>
  <text x="62" y="442" class="panel-label">(b)</text>
  <text x="105" y="442" class="panel-title">Proposed workflow: explicit GPU U0, request-level KV ownership, concurrent GPU decode and HTP prefill</text>

  <!-- Lane backgrounds -->
  <rect x="65" y="467" width="1390" height="105" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="65" y="586" width="1390" height="151" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="65" y="751" width="1390" height="122" rx="7" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="65" y="887" width="1390" height="151" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="88" y="526" class="lane">Scheduler / response</text>
  <text x="88" y="667" class="lane">GPU / OpenCL</text>
  <text x="88" y="818" class="lane">Host KV transport</text>
  <text x="88" y="969" class="lane">NPU / HTP</text>

  <!-- Numbered stages -->
  <circle cx="245" cy="493" r="16" fill="#475569"/><text x="245" y="493" class="step">1</text>
  <circle cx="500" cy="612" r="16" fill="#2563eb"/><text x="500" y="612" class="step">2</text>
  <circle cx="706" cy="777" r="16" fill="#d97706"/><text x="706" y="777" class="step">3</text>
  <circle cx="960" cy="913" r="16" fill="#059669"/><text x="960" y="913" class="step">4</text>
  <circle cx="1268" cy="777" r="16" fill="#d97706"/><text x="1268" y="777" class="step">5</text>

  <!-- Scheduler lane -->
  <rect x="205" y="500" width="235" height="54" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="322" y="521" class="box-title">Decode-first row order</text>
  <text x="322" y="542" class="small">[D, P0 ... P62] | [P63 ...]</text>

  <rect x="855" y="489" width="210" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="960" y="514" class="box-title">A logits available</text>
  <text x="960" y="538" class="box-text">110.90 ms median</text>
  <rect x="1120" y="489" width="220" height="65" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1230" y="514" class="box-title">Sample + output queue</text>
  <text x="1230" y="538" class="small">server integration point</text>

  <!-- GPU lane -->
  <rect x="455" y="623" width="210" height="78" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="647" class="box-title">Mixed U0 on GPU</text>
  <text x="560" y="671" class="box-text">1 decode + 63 prefill</text>
  <text x="560" y="691" class="small">GEMM-shaped first batch</text>

  <rect x="710" y="623" width="105" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="762" y="648" class="box-title">Fence</text>
  <text x="762" y="672" class="small">logits + KV</text>
  <text x="762" y="691" class="small">are complete</text>

  <rect x="860" y="623" width="230" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="975" y="647" class="box-title">Continue A decode</text>
  <text x="975" y="671" class="box-text">10 token graphs</text>
  <text x="975" y="691" class="small">concurrent with HTP</text>

  <rect x="1135" y="623" width="150" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
  <text x="1210" y="647" class="box-title">Boundary gate</text>
  <text x="1210" y="671" class="box-text">read FINAL bit</text>
  <text x="1210" y="691" class="small">median wait 2.17 ms</text>

  <rect x="1330" y="623" width="100" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="1380" y="648" class="box-title">Import</text>
  <text x="1380" y="672" class="box-text">full B KV</text>
  <text x="1380" y="691" class="small">B GPU-ready</text>

  <!-- Host KV lane -->
  <rect x="650" y="786" width="170" height="63" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="735" y="810" class="box-title">Export B prefix</text>
  <text x="735" y="833" class="box-text">0.78 MB state blob</text>

  <rect x="855" y="786" width="160" height="63" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="935" y="810" class="box-title">Host-portable KV</text>
  <text x="935" y="833" class="box-text">1.84 ms median</text>

  <rect x="1190" y="786" width="170" height="63" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="1275" y="810" class="box-title">Export full B KV</text>
  <text x="1275" y="833" class="box-text">6.15 MB state blob</text>

  <rect x="1380" y="786" width="55" height="63" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="1407" y="810" class="box-title">37.69</text>
  <text x="1407" y="833" class="small">ms</text>

  <!-- NPU lane -->
  <rect x="855" y="922" width="160" height="78" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="935" y="947" class="box-title">Import prefix KV</text>
  <text x="935" y="971" class="box-text">B owner: HTP</text>
  <text x="935" y="991" class="small">positions 0 ... 62</text>

  <rect x="1050" y="922" width="210" height="78" rx="8" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
  <text x="1155" y="947" class="box-title">Grouped HTP U1 ... U6</text>
  <text x="1155" y="971" class="box-text">384 rows / one submit</text>
  <text x="1155" y="991" class="small">250.07 ms median</text>

  <rect x="1290" y="922" width="135" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
  <text x="1357" y="947" class="box-title">FINAL bit + U7</text>
  <text x="1357" y="971" class="small">53 rows; submit 2</text>
  <text x="1357" y="991" class="small">49.97 ms median</text>

  <!-- Proposed edges -->
  <path d="M440 527 H470 V623" class="edge-gray"/>
  <path d="M665 662 H710" class="edge-blue"/>
  <path d="M815 643 H835 V522 H855" class="edge-red"/>
  <path d="M1065 522 H1120" class="edge-red"/>
  <path d="M815 680 H860" class="edge-blue"/>
  <path d="M1090 662 H1135" class="edge-blue"/>
  <path d="M815 680 V755 H735 V786" class="edge-gold"/>
  <path d="M820 818 H855" class="edge-gold"/>
  <path d="M935 849 V922" class="edge-gold"/>
  <path d="M1015 961 H1050" class="edge-green"/>
  <path d="M1260 961 H1290" class="edge-green"/>
  <path d="M1425 961 H1450 V724 H1210 V701" class="edge-control"/>
  <path d="M1210 701 V755 H1275 V786" class="edge-control"/>
  <path d="M1357 922 V880 H1275 V849" class="edge-gold"/>
  <path d="M1360 818 H1380" class="edge-gold"/>
  <path d="M1407 786 V729 H1380 V701" class="edge-gold"/>

  <!-- State ownership annotations -->
  <rect x="482" y="710" width="156" height="22" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="560" y="725" class="state">B: GPU_PREFIX</text>
  <rect x="1052" y="1008" width="206" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="1155" y="1023" class="state">B: NPU_READY at 414.97 ms</text>
  <rect x="1197" y="856" width="156" height="22" rx="11" fill="#ffffff" stroke="#fbbf24"/>
  <text x="1275" y="871" class="state">B: MIGRATING</text>
  <rect x="1302" y="710" width="156" height="22" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1380" y="725" class="state">B: GPU_READY</text>

  <!-- Verified metrics panel -->
  <rect x="1480" y="467" width="252" height="571" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1500" y="499" class="metric-title">Verified OP15 result</text>
  <text x="1500" y="523" class="tiny">5 timing processes; audit separate</text>
  <line x1="1500" y1="540" x2="1712" y2="540" stroke="#cbd5e1"/>

  <text x="1500" y="572" class="metric">GPU-only completion</text>
  <text x="1500" y="598" class="metric-strong">906.61 ms</text>
  <text x="1500" y="619" class="tiny">range 586.96-906.94</text>

  <text x="1500" y="659" class="metric">A decode logits available</text>
  <text x="1500" y="685" class="metric-strong" fill="#dc2626">110.90 ms</text>
  <text x="1500" y="706" class="tiny">range 73.70-111.64</text>
  <rect x="1500" y="719" width="116" height="29" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="1558" y="739" class="box-title" fill="#b91c1c">8.16x sooner</text>

  <text x="1500" y="782" class="metric">B KV restored on GPU</text>
  <text x="1500" y="808" class="metric-strong" fill="#2563eb">454.68 ms</text>
  <text x="1500" y="829" class="tiny">range 416.17-458.07</text>
  <rect x="1500" y="842" width="116" height="29" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1558" y="862" class="box-title" fill="#1d4ed8">1.99x faster</text>

  <line x1="1500" y1="890" x2="1712" y2="890" stroke="#cbd5e1"/>
  <text x="1500" y="919" class="metric">Correctness:</text>
  <text x="1500" y="942" class="tiny">15/15 argmax checks passed</text>
  <text x="1500" y="971" class="metric">Scheduled nodes (audit):</text>
  <text x="1500" y="994" class="tiny">99.81% OpenCL; 99.63% HTP</text>
  <text x="1500" y="1021" class="tiny">Node placement is not a FLOP share</text>

  <!-- Legend -->
  <line x1="75" y1="1122" x2="132" y2="1122" class="edge-blue"/><text x="145" y="1127" class="tiny">GPU compute</text>
  <line x1="285" y1="1122" x2="342" y2="1122" class="edge-green"/><text x="355" y="1127" class="tiny">NPU compute</text>
  <line x1="495" y1="1122" x2="552" y2="1122" class="edge-gold"/><text x="565" y="1127" class="tiny">KV data movement</text>
  <line x1="755" y1="1122" x2="812" y2="1122" class="edge-red"/><text x="825" y="1127" class="tiny">latency-critical response</text>
  <line x1="1050" y1="1122" x2="1107" y2="1122" class="edge-control"/><text x="1120" y="1127" class="tiny">atomic control hint</text>
  <text x="1490" y="1127" class="tiny">Solid timing values: median; brackets: min-max</text>

  <text x="50" y="1162" class="subtitle">Figure: A enters sampling after the first GPU fence; HTP U1-U6 share one host submission, and the final bit prevents a new GPU token graph before U7 and full-KV handback.</text>
</svg>
